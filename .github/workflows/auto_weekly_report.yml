name: Weekly Progress Report Auto-Commit

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab matplotlib

      - name: Show Current Date and Time
        run: |
          date
          date -u

      - name: Generate Weekly PDF
        run: |
          python generate_report.py weekly

      - name: Check Generated PDF
        run: |
          echo "Generated PDF files:"
          ls -lh *_Weekly_Progress_Report_Form-3_*.pdf

      - name: Move Report
        run: |
          mkdir -p weekly_reports

          mv *_Weekly_Progress_Report_Form-3_*.pdf weekly_reports/

          echo "Reports currently stored:"
          ls -lh weekly_reports/

      - name: Commit Weekly Report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly_reports/

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "docs: add weekly progress report"
          git push origin HEAD:main